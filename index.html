<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamBoard — Книга мечтаний</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4a853">
  <script src="js/html2canvas.min.js"></script>
</head>

<body>
  <canvas id="particles-canvas"></canvas>

  <button class="theme-toggle" onclick="openThemePicker()" title="Сменить тему">🎨</button>

  <div id="authScreen" class="screen auth-screen active">
    <div class="auth-container">
      <div class="auth-logo">
        <span class="logo-icon">🌙</span>
        <h1>DreamBoard</h1>
        <p>Запиши свою мечту — и она станет ближе ✨</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
          <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        <div id="authError" class="auth-error"></div>
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>👤 Логин</label>
            <input type="text" id="loginUsername" placeholder="Введите логин" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>🔑 Пароль</label>
            <div class="password-field">
              <input type="password" id="loginPassword" placeholder="Введите пароль" required
                autocomplete="current-password">
              <button type="button" class="password-toggle"
                onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">✨ Войти</button>
          <button type="button" class="forgot-password-link" onclick="openForgotPasswordModal()">🔮 Забыли
            пароль?</button>
        </form>
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>🌟 Ваше имя</label>
            <input type="text" id="regName" placeholder="Как вас зовут?" required>
          </div>
          <div class="form-group">
            <label>👤 Логин</label>
            <input type="text" id="regUsername" placeholder="Придумайте логин" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>🔑 Пароль</label>
            <div class="password-field">
              <input type="password" id="regPassword" placeholder="Придумайте пароль" required minlength="4"
                autocomplete="new-password">
              <button type="button" class="password-toggle"
                onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">🚀 Создать аккаунт</button>
        </form>
        <div class="auth-extra-links">
          <button class="auth-extra-link" onclick="openImportModal()">📥 Импорт данных</button>
        </div>
      </div>
      <div style="text-align: center; margin-top: 24px; font-size: 18px; color: var(--ink-light);">
        Есть вопросы? Перейдите на
        <a href="https://eugenius-mylnikoff.github.io/Portfolio/" target="_blank"
          style="color: var(--gold); text-decoration: none;">сайт разработчика</a>
        и свяжитесь с ним ✨
      </div>
    </div>
    <button class="pwa-info-btn" onclick="openPwaModal()" title="Установить как приложение">📱</button>
  </div>

  <div id="appScreen" class="screen app-screen">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <span class="h-icon">🌙</span>
          <h2>DreamBoard</h2>
        </div>
        <div class="header-right">
          <div class="mode-tabs">
            <button class="mode-tab active" onclick="switchMode('dreams')">Мечты</button>
            <button class="mode-tab" onclick="switchMode('thoughts')">Мысли</button>
          </div>
          <button class="icon-btn" onclick="openRandomDream()" title="Случайная мечта">🎲</button>
          <button class="icon-btn info-btn" onclick="openInfoModal()" title="О приложении">i</button>
          <div class="user-menu">
            <div class="user-avatar" id="userAvatar" onclick="toggleUserMenu()"></div>
            <div class="user-dropdown" id="userDropdown">
              <div class="user-dropdown-header">
                <div class="name" id="dropdownName"></div>
                <div class="login" id="dropdownLogin"></div>
              </div>
              <button class="user-dropdown-item" onclick="openProfileEditModal()">👤 Редактировать профиль</button>
              <button class="user-dropdown-item" onclick="openCategoriesModal()">📂 Мои категории</button>
              <button class="user-dropdown-item" onclick="openArchiveModal()">📦 Архивные мечты</button>
              <button class="user-dropdown-item" onclick="openNotificationsModal()">🔔 Уведомления</button>
              <button class="user-dropdown-item" onclick="exportUserData()">💾 Экспортировать данные</button>
              <div class="user-dropdown-divider"></div>
              <button class="user-dropdown-item danger" onclick="openResetModal()">🗑️ Удалить профиль</button>
              <button class="user-dropdown-item danger" onclick="handleLogout()">🚪 Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="dreamsMode">
        <div class="greeting" id="greeting"></div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="filter-bar" id="filterBar"></div>
        <div class="dreams-grid" id="dreamsGrid"></div>
      </div>
      <div id="thoughtsMode" class="diary-screen" style="display: none;">
        <div class="diary-container">
          <div class="diary-header">
            <h2 class="diary-title">📖 Мои мысли</h2>
            <button class="diary-add-btn" onclick="openCreateThoughtModal()">+ Новая мысль</button>
          </div>
          <div class="diary-page-wrapper">
            <div class="diary-page" id="diaryPage">
              <div class="diary-stickers" id="diaryStickers"></div>
            </div>
          </div>
          <div class="diary-pagination">
            <button class="diary-page-btn" id="prevPageBtn" onclick="prevDiaryPage()">◀</button>
            <span class="diary-page-indicator" id="pageIndicator">Страница 1</span>
            <button class="diary-page-btn" id="nextPageBtn" onclick="nextDiaryPage()">▶</button>
          </div>
        </div>
      </div>
    </main>

    <button class="fab" id="mainFab" onclick="openCreateModal()" title="Новая мечта">✦</button>
  </div>

  <div class="modal-overlay" id="dreamModal">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle">✨ Новая мечта</h3>
      <form onsubmit="handleSaveDream(event)">
        <input type="hidden" id="dreamId">
        <div class="form-group">
          <label>🌟 Название мечты</label>
          <input type="text" id="dreamTitleInput" placeholder="Чего ты хочешь?" required>
        </div>
        <div class="form-group">
          <label>📝 Описание</label>
          <textarea id="dreamTextInput" placeholder="Расскажи подробнее..."></textarea>
        </div>
        <div class="form-group">
          <label>📂 Категория</label>
          <select id="dreamCategory"></select>
        </div>
        <div class="form-group">
          <label>🎨 Цвет</label>
          <div class="color-picker" id="colorPicker">
            <div class="color-option color-gold selected" data-color="gold" onclick="selectColor(this)"></div>
            <div class="color-option color-rose" data-color="rose" onclick="selectColor(this)"></div>
            <div class="color-option color-sky" data-color="sky" onclick="selectColor(this)"></div>
            <div class="color-option color-mint" data-color="mint" onclick="selectColor(this)"></div>
            <div class="color-option color-lavender" data-color="lavender" onclick="selectColor(this)"></div>
            <div class="color-option color-sunset" data-color="sunset" onclick="selectColor(this)"></div>
          </div>
        </div>
        <div class="steps-section">
          <div class="steps-header">
            <div class="steps-title">👣 Шаги достижения</div>
            <button type="button" class="add-step-btn" onclick="openStepModal()">+ Добавить шаг</button>
          </div>
          <div class="steps-table-wrapper">
            <table class="steps-table">
              <thead>
                <tr>
                  <th>№</th>
                  <th>Описание</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody id="stepsTableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('dreamModal')">Отмена</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">💫 Записать мечту</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="stepModal">
    <div class="modal">
      <h3 class="modal-title" id="stepModalTitle">✨ Новый шаг</h3>
      <form onsubmit="handleSaveStep(event)">
        <input type="hidden" id="stepEditIndex" value="-1">
        <div class="form-group">
          <label>📝 Описание шага</label>
          <textarea id="stepDescription" placeholder="Что нужно сделать?" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('stepModal')">Отмена</button>
          <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="genericModal">
    <div class="modal">
      <div id="genericModalContent"></div>
    </div>
  </div>

  <div class="random-dream-modal" id="randomDreamModal">
    <div class="random-dream-content">
      <button class="random-dream-close" onclick="closeRandomDream()">✕</button>
      <div class="random-dream-category" id="randomDreamCategory"></div>
      <div class="random-dream-title" id="randomDreamTitle"></div>
      <div class="random-dream-text" id="randomDreamText"></div>
      <div class="random-dream-actions">
        <button class="btn btn-secondary" onclick="openRandomDream()">🎲 Ещё одну</button>
        <button class="btn btn-primary" onclick="closeRandomDream()">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/script.js"></script>
</body>

</html>
